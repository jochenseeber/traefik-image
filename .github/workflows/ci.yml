name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: v1.7.12
        run: |
          set -euo pipefail
          go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run rubocop, unit tests and actionlint
        run: bundle exec rubocop && bundle exec rake unit && rake lint

  build:
    name: Build and verify ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      # Every job runs on an amd64 runner, so any other platform is built and
      # executed under emulation. That is slower than a native arm64 runner but
      # available on every repository, and the checks only run version-reporting
      # commands and a short-lived Traefik service — nothing where emulation would
      # change the answer.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # No Docker Hub login: the only image pulled here is the public Traefik and
      # Alpine images, which need no credentials. Keeping the push token out of a
      # workflow that runs on every branch is worth more than insurance against
      # an anonymous pull limit this repository has never hit. If it ever does,
      # add a read-only login *before* the two actions above — they pull from
      # Docker Hub themselves, so a login after them protects nothing.
      - name: Build and verify
        env:
          IMAGE_PLATFORMS: ${{ matrix.platform }}
        run: rake image:build image:verify
