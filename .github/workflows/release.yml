# Build release images
#
# Requires these secrets on the `release` environment (not repository
# secrets):
#   DOCKERHUB_USERNAME  the Docker Hub account that owns the namespace
#   DOCKERHUB_TOKEN     an access token for it, not the account password
name: Release

on:
  push:
    tags:
      - "v*"
  # How mirror.yml publishes: tags pushed with the workflow token start no
  # workflows, so it dispatches this one on the tag instead. A dispatch on
  # anything but a matching tag fails the tag check below.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config:
    name: Resolve configuration & check tag
    runs-on: ubuntu-24.04
    outputs:
      reference: ${{ steps.read.outputs.reference }}
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - id: read
        run: |
          set -euo pipefail
          reference=$(rake --silent image:reference)
          test -n "$reference"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "Publishes: $reference"

          expected=$(rake --silent image:release_ref)
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the Rakefile, which expects $expected. Bump the Rakefile and re-tag." >&2
            exit 1
          fi

  # Skipped when mirror.yml dispatched this run: the mirror ran the same build
  # and checks on this exact commit before tagging it, so a third build here
  # adds nothing. Any other start — a pushed tag, a dispatch by a person — still
  # runs CI. Should the actor ever not match, CI simply runs again.
  ci:
    name: CI
    if: github.event_name != 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build, verify and push ${{ needs.config.outputs.reference }}
    runs-on: ubuntu-24.04
    needs: [config, ci]
    # A skipped need skips this job by default, so accept a skipped CI
    # explicitly — but never a failed or cancelled one.
    if: >-
      !cancelled() && needs.config.result == 'success' &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    # Where the Docker Hub credentials live. Environment secrets reach only the
    # jobs that name their environment, so this line is what makes them visible
    # here — without it they silently resolve to empty and the login fails on
    # "Username and password required". The environment's own policy restricts
    # it to `v*` tags, so no branch build can claim them.
    environment: release
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      # `rake image:build` loads a multi-platform image into the daemon, which
      # the classic image store cannot hold — it keeps one platform per tag.
      # The runners ship with it, so switch the daemon to the containerd image
      # store before anything touches Docker.
      - name: Enable the containerd image store
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/docker
          echo '{"features":{"containerd-snapshotter":true}}' \
            | sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}' | grep -q containerd.snapshotter

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, verify and push
        run: rake image:push
